[project]
name = "mailer"
version = "0.1.0"
description = "Archive Outlook (Exchange) mail to .msg files before retention policy deletes them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "olefile>=0.47",
    "pyside6-essentials>=6.8",
    "pywin32>=311; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.5.0",
]

[tool.uv]
package = false
# VDI 에서는 uv 캐시(C:)와 저장소가 다른 드라이브에 있어 하드링크가 안 된다
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
